<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Buques - TRANSMAR S.A.C.I.</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); max-width: 750px; width: 100%; box-sizing: border-box; }
        h2 { margin-top: 0; color: #ffffff; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .section-box { background: #252525; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        label { font-size: 0.85em; font-weight: bold; color: #17a2b8; text-transform: uppercase; }
        input[type="text"], input[type="password"], input[type="email"] { padding: 10px; border: 1px solid #444; border-radius: 6px; background-color: #2d2d2d; color: #ffffff; font-size: 14px; width: 100%; box-sizing: border-box; }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus { outline: none; border-color: #007bff; }
        .btn-add { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; height: 38px; }
        .btn-add:hover { background-color: #218838; }
        .search-container { margin-bottom: 20px; position: relative; }
        .search-container input { padding: 12px 15px 12px 40px; font-size: 15px; border: 2px solid #007bff; border-radius: 8px; background-color: #1a1a1a; }
        .search-icon { position: absolute; left: 12px; top: 12px; font-size: 16px; }
        .backup-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-tool { flex: 1; padding: 8px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; min-width: 140px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-excel { background-color: #1f7244; } .btn-excel:hover { background-color: #155230; }
        .btn-export { background-color: #6f42c1; } .btn-export:hover { background-color: #59339d; }
        .btn-import { background-color: #fd7e14; } .btn-import:hover { background-color: #e86e0c; }
        .toggle-btn { background-color: #333; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .toggle-btn:hover { background-color: #444; }
        .table-container { max-height: 400px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; display: none; }
        .table-container.open { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; color: #e0e0e0; }
        th, td { padding: 10px 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #1a1a1a; color: #17a2b8; position: sticky; top: 0; z-index: 1; }
        tr:hover { background-color: #2d2d2d; }
        .btn-delete { background-color: transparent; color: #dc3545; border: 1px solid #dc3545; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-delete:hover { background-color: #dc3545; color: white; }
        .empty-msg { text-align: center; padding: 20px; color: #888; font-style: italic; }
        
        .auth-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .auth-bar input { width: 160px; padding: 6px 10px; font-size: 12px; }
        .btn-login { background-color: #007bff; color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-login:hover { background-color: #0056b3; }
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-logout:hover { background-color: #c82333; }
        .editor-info { font-size: 12px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-bar" id="authDesconectado">
        <input type="email" id="inputEmail" placeholder="Correo de Editor...">
        <input type="password" id="inputClave" placeholder="Contraseña..." onkeypress="if(event.key === 'Enter') window.iniciarSesion()">
        <button class="btn-login" onclick="window.iniciarSesion()">Acceder</button>
    </div>
    <div class="auth-bar" id="authConectado" style="display: none;">
        <span class="editor-info" id="nombreEditor"></span>
        <button class="btn-logout" onclick="window.cerrarSesion()">Salir</button>
    </div>

    <h2>Directorio de Buques y Códigos OPUS</h2>
    
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="inputBusqueda" placeholder="Buscar por nombre de buque o código OPUS..." onkeyup="window.buscarBuque()">
    </div>

    <div id="panelEdicion" style="display: none;">
        <div class="section-box">
            <div class="form-row">
                <div class="form-group">
                    <label>Buque</label>
                    <input type="text" id="inputBuque" placeholder="Ej: RIO PARANA" onkeypress="if(event.key === 'Enter') window.agregarBuque()">
                </div>
                <div class="form-group">
                    <label>Código OPUS</label>
                    <input type="text" id="inputCodigo" placeholder="Ej: RPN304" onkeypress="if(event.key === 'Enter') window.agregarBuque()">
                </div>
                <button class="btn-add" onclick="window.agregarBuque()">Agregar ➕</button>
            </div>
        </div>

        <div class="backup-bar">
            <button class="btn-tool btn-excel" onclick="window.exportarExcel()">📊 Exportar a Excel</button>
            <button class="btn-tool btn-export" onclick="window.exportarBackup()">💾 Guardar Backup</button>
            <label class="btn-tool btn-import" style="margin: 0; cursor: pointer;">
                📂 Cargar Backup
                <input type="file" id="inputBackup" accept=".json" style="display: none;" onchange="window.importarBackup(event)">
            </label>
        </div>
    </div>

    <button class="toggle-btn" onclick="window.toggleTabla()" id="btnToggleTabla">
        <span>📋 Ver Tabla Completa de Buques (<span id="totalCount">0</span> registros)</span>
        <span id="flechaToggle">▼</span>
    </button>

    <div class="table-container" id="contenedorTabla">
        <table id="tablaBuques">
            <thead>
                <tr>
                    <th>BUQUES</th>
                    <th>CÓDIGO OPUS</th>
                    <th id="colAccion" style="width: 80px; text-align: center; display: none;">ACCIÓN</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBr7_yfrfK6teqg9QTgdmCqmxUnrILkFpU",
      authDomain: "oficode-97a1f.firebaseapp.com",
      projectId: "oficode-97a1f",
      storageBucket: "oficode-97a1f.firebasestorage.app",
      messagingSenderId: "207310014715",
      appId: "1:207310014715:web:b310aa21043a57a0b9485e",
      measurementId: "G-PMLZYNNS5E"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let baseDatosBuques = [];
    let usuarioActual = null;

    onAuthStateChanged(auth, async (user) => {
        const divDesconectado = document.getElementById('authDesconectado');
        const divConectado = document.getElementById('authConectado');
        const panelEdicion = document.getElementById('panelEdicion');
        const colAccion = document.getElementById('colAccion');

        if (user) {
            usuarioActual = user;
            divDesconectado.style.display = 'none';
            divConectado.style.display = 'flex';
            panelEdicion.style.display = 'block';
            colAccion.style.display = 'table-cell';
            
            const identificador = user.displayName || user.email.split('@')[0];
            document.getElementById('nombreEditor').innerText = `👋 Hola, ${identificador}`;
            
            await migrarDatosLocalesAFirebase();
        } else {
            usuarioActual = null;
            divDesconectado.style.display = 'flex';
            divConectado.style.display = 'none';
            panelEdicion.style.display = 'none';
            colAccion.style.display = 'none';
            document.getElementById('inputClave').value = '';
            document.getElementById('inputEmail').value = '';
        }
        
        actualizarTablaVisual();
    });

    async function migrarDatosLocalesAFirebase() {
        const datosRaw = localStorage.getItem('bd_buques');
        if (!datosRaw) return;

        let datosLocales;
        try {
            datosLocales = JSON.parse(datosRaw);
        } catch (e) {
            console.error("Error al leer la memoria local:", e);
            return;
        }

        if (!Array.isArray(datosLocales) || datosLocales.length === 0) return;

        const autorRegistro = usuarioActual.displayName || usuarioActual.email;
        const batch = writeBatch(db);
        let contadorPreparados = 0;

        for (const item of datosLocales) {
            const nombreBuque = (item.buque || item.nombre || "").toString().trim().toUpperCase();
            const codigoOpus = (item.codigo || item.code || "").toString().trim().toUpperCase();

            if (!nombreBuque || !codigoOpus) continue;

            const yaExiste = baseDatosBuques.some(b => 
                (b.buque && b.buque.toString().toUpperCase() === nombreBuque) || 
                (b.codigo && b.codigo.toString().toUpperCase() === codigoOpus)
            );

            if (!yaExiste) {
                const nuevoDocRef = doc(collection(db, "buques"));
                batch.set(nuevoDocRef, {
                    buque: nombreBuque,
                    codigo: codigoOpus,
                    autor: autorRegistro,
                    fechaCreacion: serverTimestamp()
                });
                contadorPreparados++;
            }
        }

        if (contadorPreparados > 0) {
            await batch.commit();
            localStorage.removeItem('bd_buques');
            alert(`¡Éxito! Se migraron ${contadorPreparados} registros locales a la nube.`);
        } else {
            localStorage.removeItem('bd_buques');
        }
    }

    window.iniciarSesion = async () => {
        const email = document.getElementById('inputEmail').value.trim();
        const clave = document.getElementById('inputClave').value.trim();

        if (!email || !clave) {
            alert("Por favor completa el correo y la contraseña.");
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, clave);
        } catch (error) {
            console.error("Error al iniciar sesión:", error);
            alert("Credenciales incorrectas o usuario no registrado en Firebase.");
        }
    };

    window.cerrarSesion = async () => {
        try { await signOut(auth); } 
        catch (error) { console.error("Error al salir:", error); }
    };

    const q = query(collection(db, "buques"), orderBy("buque"));
    onSnapshot(q, (snapshot) => {
        baseDatosBuques = [];
        snapshot.forEach((doc) => {
            baseDatosBuques.push({ id: doc.id, ...doc.data() });
        });
        window.buscarBuque();
    });

    window.agregarBuque = async () => {
        if (!usuarioActual) return;
        
        const buque = document.getElementById('inputBuque').value.trim().toUpperCase();
        const codigo = document.getElementById('inputCodigo').value.trim().toUpperCase();

        if (buque === "" || codigo === "") {
            alert("Por favor completá ambos campos (Buque y Código OPUS).");
            return;
        }

        if (baseDatosBuques.find(b => b.buque === buque)) {
            alert(`❌ El buque "${buque}" ya está registrado.`);
            return;
        }
        if (baseDatosBuques.find(b => b.codigo === codigo)) {
            alert(`❌ El código "${codigo}" ya está asignado.`);
            return;
        }

        const autorRegistro = usuarioActual.displayName || usuarioActual.email;

        try {
            await addDoc(collection(db, "buques"), {
                buque: buque,
                codigo: codigo,
                autor: autorRegistro,
                fechaCreacion: serverTimestamp()
            });
            document.getElementById('inputBuque').value = "";
            document.getElementById('inputCodigo').value = "";
            document.getElementById('inputBuque').focus();
        } catch (error) {
            console.error("Error agregando:", error);
            alert("No tienes permisos para agregar o hubo un error.");
        }
    };

    window.eliminarBuque = async (idFirebase) => {
        if (!usuarioActual) return;
        if(confirm("¿Estás seguro de eliminar este registro?")) {
            try {
                await deleteDoc(doc(db, "buques", idFirebase));
            } catch(e) {
                console.error("Error borrando:", e);
                alert("Error al eliminar el registro.");
            }
        }
    };

    function actualizarTablaVisual(datosParaMostrar = null) {
        const cuerpoTabla = document.getElementById('cuerpoTabla');
        document.getElementById('totalCount').innerText = baseDatosBuques.length;
        const lista = datosParaMostrar !== null ? datosParaMostrar : baseDatosBuques;

        cuerpoTabla.innerHTML = "";
        if (lista.length === 0) {
            cuerpoTabla.innerHTML = `<tr><td colspan="${usuarioActual ? 3 : 2}" class="empty-msg">No hay registros para mostrar.</td></tr>`;
            return;
        }

        lista.forEach((item) => {
            const tr = document.createElement('tr');
            
            let htmlFila = `
                <td><strong>${item.buque}</strong></td>
                <td style="color: #17a2b8; font-family: monospace; font-size: 15px; font-weight: bold;">${item.codigo}</td>
            `;

            if (usuarioActual) {
                htmlFila += `
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="window.eliminarBuque('${item.id}')" title="Eliminar">🗑️</button>
                </td>`;
            }
            
            tr.innerHTML = htmlFila;
            cuerpoTabla.appendChild(tr);
        });
    }

    window.buscarBuque = () => {
        const textoBusqueda = document.getElementById('inputBusqueda').value.toUpperCase().trim();
        const contenedorTabla = document.getElementById('contenedorTabla');
        
        if (textoBusqueda === "") {
            actualizarTablaVisual();
            return;
        }
        if (!contenedorTabla.classList.contains("open")) {
            window.abrirTabla();
        }
        const resultados = baseDatosBuques.filter(item => 
            item.buque.includes(textoBusqueda) || item.codigo.includes(textoBusqueda)
        );
        actualizarTablaVisual(resultados);
    };

    window.toggleTabla = () => {
        const contenedorTabla = document.getElementById('contenedorTabla');
        if (contenedorTabla.classList.contains("open")) {
            window.cerrarTabla();
        } else {
            window.abrirTabla();
            actualizarTablaVisual();
            document.getElementById('inputBusqueda').value = "";
        }
    };

    window.abrirTabla = () => {
        document.getElementById('contenedorTabla').classList.add("open");
        document.getElementById('flechaToggle').innerText = "▲";
    };

    window.cerrarTabla = () => {
        document.getElementById('contenedorTabla').classList.remove("open");
        document.getElementById('flechaToggle').innerText = "▼";
    };

    window.exportarExcel = () => {
        if (baseDatosBuques.length === 0) { alert("No hay registros para exportar."); return; }
        const wb = XLSX.utils.book_new();
        const headers = ["BUQUES", "CÓDIGO OPUS"];
        const rows = baseDatosBuques.map(item => [item.buque, item.codigo]);
        const data = [headers, ...rows];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const range = XLSX.utils.decode_range(ws['!ref']);
        const styleHeader = { font: { name: "Aptos", sz: 10, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "41719C" } }, alignment: { horizontal: "center", vertical: "center" }, border: { top: { style: "thin", color: { rgb: "2B4C7E" } }, bottom: { style: "thin", color: { rgb: "2B4C7E" } }, left: { style: "thin", color: { rgb: "2B4C7E" } }, right: { style: "thin", color: { rgb: "2B4C7E" } } } };
        const styleData = { font: { name: "Aptos", sz: 10 }, alignment: { horizontal: "center", vertical: "center" }, border: { top: { style: "thin", color: { rgb: "B4C6E7" } }, bottom: { style: "thin", color: { rgb: "B4C6E7" } }, left: { style: "thin", color: { rgb: "B4C6E7" } }, right: { style: "thin", color: { rgb: "B4C6E7" } } } };
        for (let R = range.s.r; R <= range.e.r; ++R) {
            for (let C = range.s.c; C <= range.e.c; ++C) {
                const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                if (!ws[cellAddress]) continue;
                ws[cellAddress].s = (R === 0) ? styleHeader : styleData;
            }
        }
        ws['!autofilter'] = { ref: `A1:B${data.length}` };
        ws['!cols'] = [{ wch: 25 }, { wch: 18 }];
        XLSX.utils.book_append_sheet(wb, ws, "Buques");
        XLSX.writeFile(wb, "Base_Buques_OPUS.xlsx");
    };

    window.exportarBackup = () => {
        if (baseDatosBuques.length === 0) { alert("No hay registros."); return; }
        const dataAExportar = baseDatosBuques.map(({buque, codigo}) => ({buque, codigo}));
        const jsonStr = JSON.stringify(dataAExportar, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `backup_buques_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };

    // Nueva función de Importación por Lote Atómico (writeBatch)
    window.importarBackup = async (event) => {
        const file = event.target.files[0];
        if (!file || !usuarioActual) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const datosImportados = JSON.parse(e.target.result);

                if (!Array.isArray(datosImportados) || datosImportados.length === 0) {
                    alert("❌ El archivo no contiene una lista válida de registros.");
                    return;
                }

                if (confirm(`Se encontraron ${datosImportados.length} buques en el archivo. ¿Deseas subirlos todos a Firebase?`)) {
                    let autorRegistro = usuarioActual.displayName || usuarioActual.email;
                    
                    // Creamos el paquete por lote (Batch)
                    const batch = writeBatch(db);
                    let contadorPreparados = 0;

                    for (let item of datosImportados) {
                        const nombreBuque = (item.buque || item.BUQUE || item.nombre || "").toString().trim().toUpperCase();
                        const codigoOpus = (item.codigo || item.CODIGO || item.code || "").toString().trim().toUpperCase();

                        if (nombreBuque && codigoOpus) {
                            // Generamos la referencia con ID automático sin hacer peticiones de red aún
                            const nuevoDocRef = doc(collection(db, "buques"));
                            batch.set(nuevoDocRef, {
                                buque: nombreBuque,
                                codigo: codigoOpus,
                                autor: autorRegistro,
                                fechaCreacion: serverTimestamp()
                            });
                            contadorPreparados++;
                        }
                    }

                    if (contadorPreparados > 0) {
                        // Enviamos los 51 registros juntas en UNA SOLA llamada a la red
                        await batch.commit();
                        alert(`¡Éxito! Se subieron los ${contadorPreparados} buques a Firebase en un solo paquete.`);
                    } else {
                        alert("⚠️ No se encontraron buques con formato válido en el archivo.");
                    }
                }
            } catch (err) {
                console.error("Error al procesar la importación:", err);
                alert("Error al procesar el archivo JSON. Revisa que el formato sea correcto.");
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    };
</script>
</body>
</html>
