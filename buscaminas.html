<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Buscaminas Interactivo</title>
    <!-- Carga de Tailwind CSS para el diseño UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes de Google Fonts (Inter y Orbitron para reloj digital) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .digital-font {
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        /* Colores tradicionales y legibles para los números de minas adyacentes */
        .num-1 { color: #2563eb; font-weight: 800; } /* Azul */
        .num-2 { color: #16a34a; font-weight: 800; } /* Verde */
        .num-3 { color: #dc2626; font-weight: 800; } /* Rojo */
        .num-4 { color: #1e1b4b; font-weight: 800; } /* Azul Oscuro */
        .num-5 { color: #991b1b; font-weight: 800; } /* Marrón/Vinotinto */
        .num-6 { color: #0d9488; font-weight: 800; } /* Turquesa */
        .num-7 { color: #111827; font-weight: 800; } /* Negro */
        .num-8 { color: #6b7280; font-weight: 800; } /* Gris */

        /* Transiciones suaves y animación al revelar casillas */
        .cell {
            transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .cell-revealed {
            animation: revealPop 0.18s ease-out forwards;
        }

        @keyframes revealPop {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Animación de mina explotando */
        .mine-exploded {
            animation: mineShake 0.4s ease-in-out;
            background-color: #ef4444 !important;
        }

        @keyframes mineShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) scale(1.1); }
            40% { transform: translateX(4px) scale(1.1); }
            60% { transform: translateX(-3px) scale(1.05); }
            80% { transform: translateX(3px) scale(1.05); }
        }

        /* Scrollbar personalizado para tableros grandes */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-6">

    <!-- Encabezado Principal -->
    <header class="text-center my-2 sm:my-4">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400">

    <!-- Panel Principal del Juego -->
    <main class="w-full max-w-4xl bg-slate-800 border border-slate-700/80 rounded-2xl shadow-2xl p-4 sm:p-6 flex flex-col items-center">
        
        <!-- Selección de Dificultad -->
        <div class="flex flex-wrap justify-center gap-2 mb-5 w-full">

                Principiante (9x9)
            </button>
            <button id="btn-intermediate" onclick="setDifficulty('intermediate')" class="diff-btn px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-600 bg-slate-700 hover:bg-slate-600 transition-all shadow-md">
                Intermedio (16x16)
            </button>
            <button id="btn-expert" onclick="setDifficulty('expert')" class="diff-btn px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-600 bg-slate-700 hover:bg-slate-600 transition-all shadow-md">
                Experto (30x16)
            </button>
        </div>

        <div class="w-full max-w-md bg-slate-950 border-2 border-slate-700 rounded-xl p-3 mb-5 flex justify-between items-center shadow-inner">

            <div class="flex flex-col items-center">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Minas</span>
                <div id="mine-counter" class="digital-font bg-black text-red-500 text-2xl sm:text-3xl px-3 py-1 rounded border border-red-950 min-w-[75px] text-center">
                    010
                </div>

            <!-- Botón Carita / Reiniciar -->
            <button id="smiley-btn" onclick="resetGame()" class="text-3xl sm:text-4xl p-2 rounded-full hover:bg-slate-800 active:scale-95 transition-transform cursor-pointer border border-slate-700 bg-slate-900 shadow-md focus:outline-none" title="Reiniciar juego">
                😃
            </button>

            <!-- Temporizador -->
            <div class="flex flex-col items-center">

        <!-- Botón Modo Bandera (Móvil) -->
        <div class="sm:hidden mb-4 w-full flex justify-center">
            <button id="flag-mode-toggle" onclick="toggleFlagMode()" class="px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 bg-slate-700 border border-slate-600 text-slate-200 transition-all shadow-md">
                <span>Modo Revelar:</span>
                <span id="flag-mode-icon" class="text-base">⛏️</span>
            </button>
        </div>

        <!-- Wrapper del Tablero con Scroll horizontal dinámico para pantallas pequeñas -->
        <div class="w-full overflow-x-auto custom-scrollbar flex justify-center p-2">
            <div id="board" class="grid gap-1 bg-slate-950 p-2 sm:p-3 rounded-2xl border-2 border-slate-700 shadow-2xl">
                <!-- Se genera dinámicamente desde JavaScript -->
            </div>
        </div>

        <!-- Opciones secundarias -->
        <div class="mt-5 flex items-center justify-between w-full max-w-md text-xs text-slate-400 px-2">
            <label class="flex items-center cursor-pointer gap-2 hover:text-slate-200 transition-colors">
                <input type="checkbox" id="sound-toggle" checked class="rounded bg-slate-700 border-slate-600 text-indigo-600 focus:ring-0">
                Efectos de sonido
            </label>
            <span id="game-status-text" class="font-medium text-slate-300">¡Haz clic en cualquier casilla para empezar!</span>
        </div>
    </main>

    <footer class="mt-6 text-center text-xs text-slate-500">
        Buscaminas Interactivo &bull; Desarrollado con HTML, CSS y JS
    </footer>

    <script>
        /* ===================================================================
           CONFIGURACIÓN Y ESTADO GLOBAL DEL JUEGO
           =================================================================== */
        
        // Ajustes predefinidos para las dificultades
        const DIFFICULTIES = {
            beginner: { rows: 9, cols: 9, mines: 10 },
            intermediate: { rows: 16, cols: 16, mines: 40 },
            expert: { rows: 16, cols: 30, mines: 99 }
        };

        // Estado actual
        let currentDifficulty = 'beginner';
        let rows = 9;
        let cols = 9;
        let totalMines = 10;
        
        // Tablero y estado de la partida
        let board = [];
        let firstClick = true;
        let gameOver = false;
        let gameWon = false;
        let flagsCount = 0;
        let revealedCount = 0;
        
        // Control de tiempo
        let timerSeconds = 0;
        let timerInterval = null;

        // Modo Bandera activado en pantallas táctiles
        let mobileFlagMode = false;

        // Contexto de Audio Web (efectos de sonido sintetizados sin archivos externos)
        let audioCtx = null;

        /**
         * Inicializa o recupera el contexto de audio.
         */
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        /**
         * Genera efectos de sonido mediante síntesis de audio programática.
         * @param {string} type Tipo de sonido ('click', 'flag', 'explode', 'win')
         */
        function playSound(type) {
            const soundEnabled = document.getElementById('sound-toggle').checked;
            if (!soundEnabled) return;

            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'flag') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'explode') {
                    // Genera ruido para simular explosión
                    const bufferSize = ctx.sampleRate * 0.3;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = ctx.createBufferSource();
                    whiteNoise.buffer = buffer;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.frequency.linearRampToValueAtTime(50, now + 0.3);

                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                    whiteNoise.connect(filter);
                    filter.connect(gain);
                    whiteNoise.start(now);
                    whiteNoise.stop(now + 0.3);
                } else if (type === 'win') {
                    // Melodía triunfal rápida
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // Do, Mi, Sol, Do
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        noteGain.gain.setValueAtTime(0.2, now + idx * 0.08);
                        noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        noteOsc.start(now + idx * 0.08);
                        noteOsc.stop(now + idx * 0.08 + 0.15);
                    });
                }
            } catch (e) {
                console.warn('Audio play failed:', e);
            }
        }

        /**
         * Cambia el nivel de dificultad actual y reinicia el tablero.
         * @param {string} diff ('beginner', 'intermediate', 'expert')
         */
        function setDifficulty(diff) {
            currentDifficulty = diff;
            const config = DIFFICULTIES[diff];
            rows = config.rows;
            cols = config.cols;
            totalMines = config.mines;

            // Actualizar estilo visual de los botones de dificultad
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'border-indigo-400', 'text-white');
                btn.classList.add('bg-slate-700', 'border-slate-600');
            });
            const activeBtn = document.getElementById(`btn-${diff}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-700', 'border-slate-600');
                activeBtn.classList.add('bg-indigo-600', 'border-indigo-400', 'text-white');
            }

            resetGame();
        }

        /**
         * Reinicia el estado completo del juego.
         */
        function resetGame() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 0;
            firstClick = true;
            gameOver = false;
            gameWon = false;
            flagsCount = 0;
            revealedCount = 0;

            document.getElementById('timer').innerText = '000';
            document.getElementById('smiley-btn').innerText = '😃';
            document.getElementById('game-status-text').innerText = '¡Haz clic en cualquier casilla para empezar!';
            updateMineCounter();

            initBoardData();
            renderBoardUI();
        }

        /**
         * Crea la estructura de datos interna del tablero.
         */
        function initBoardData() {
            board = [];
            for (let r = 0; r < rows; r++) {
                const rowArray = [];
                for (let c = 0; c < cols; c++) {
                    rowArray.push({
                        row: r,
                        col: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0
                    });
                }
                board.push(rowArray);
            }
        }

        /**
         * Construye el tablero HTML visualmente basándose en las filas y columnas.
         */
        function renderBoardUI() {
            const boardContainer = document.getElementById('board');
            boardContainer.innerHTML = '';
            
            // Ajuste dinámico de columnas mediante CSS Grid
            boardContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cellBtn = document.createElement('button');
                    cellBtn.id = `cell-${r}-${c}`;
                    cellBtn.className = 'cell w-8 h-8 sm:w-9 sm:h-9 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded-lg flex items-center justify-center text-sm font-bold shadow border border-slate-600/50 cursor-pointer focus:outline-none';
                    
                    // Manejadores de eventos de ratón
                    cellBtn.addEventListener('click', (e) => handleCellClick(r, c));
                    cellBtn.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });

                    // Cambiar carita a "sorprendida" durante la pulsación
                    cellBtn.addEventListener('mousedown', () => {
                        if (!gameOver && !gameWon) {
                            document.getElementById('smiley-btn').innerText = '😮';
                        }
                    });
                    cellBtn.addEventListener('mouseup', () => {
                        if (!gameOver && !gameWon) {
                            document.getElementById('smiley-btn').innerText = '😃';
                        }
                    });

                    boardContainer.appendChild(cellBtn);
                }
            }
        }

        /**
         * Genera las minas aleatoriamente garantizando que el primer clic nunca sea una mina.
         * @param {number} safeRow Fila del primer clic
         * @param {number} safeCol Columna del primer clic
         */
        function placeMines(safeRow, safeCol) {
            let minesPlaced = 0;

            while (minesPlaced < totalMines) {
                const randomRow = Math.floor(Math.random() * rows);
                const randomCol = Math.floor(Math.random() * cols);

                // Evita colocar minas en la casilla inicial o en las adyacentes inmediatas para garantizar apertura inicial limpia
                const isSafeZone = Math.abs(randomRow - safeRow) <= 1 && Math.abs(randomCol - safeCol) <= 1;

                if (!board[randomRow][randomCol].isMine && !isSafeZone) {
                    board[randomRow][randomCol].isMine = true;
                    minesPlaced++;
                }
            }

            // Calcular el número de minas vecinas para cada casilla
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].isMine) {
                        board[r][c].neighborMines = countNeighborMines(r, c);
                    }
                }
            }
        }

        /**
         * Cuenta la cantidad de minas alrededor de una casilla (r, c).
         */
        function countNeighborMines(r, c) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr;
                    const nc = c + dc;
                    if (isValidCell(nr, nc) && board[nr][nc].isMine) {
                        count++;
                    }
                }
            }
            return count;
        }

        /**
         * Verifica si las coordenadas pertenecen a una casilla válida dentro del tablero.
         */
        function isValidCell(r, c) {
            return r >= 0 && r < rows && c >= 0 && c < cols;
        }

        /**
         * Maneja la interacción principal al hacer clic en una casilla.
         */
        function handleCellClick(r, c) {
            if (gameOver || gameWon) return;

            // Si el modo bandera en móviles está activo, comportarse como clic derecho
            if (mobileFlagMode) {
                handleCellRightClick(r, c);
                return;
            }

            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            // Iniciar temporizador y generar minas en el primer clic
            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            // Revelar casilla
            if (cell.isMine) {
                triggerGameOver(r, c);
            } else {
                playSound('click');
                revealCell(r, c);
                checkWinCondition();
            }
        }

        /**
         * Maneja el clic derecho (colocar/quitar bandera).
         */
        function handleCellRightClick(r, c) {
            if (gameOver || gameWon) return;

            const cell = board[r][c];
            if (cell.isRevealed) return;

            cell.isFlagged = !cell.isFlagged;
            flagsCount += cell.isFlagged ? 1 : -1;

            playSound('flag');
            updateCellUI(r, c);
            updateMineCounter();
        }

        /**
         * Revela la casilla especificada y, si su valor es 0, ejecuta el algoritmo
         * de propagación (Flood Fill / BFS) para revelar las casillas contiguas de forma vacía.
         */
        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            revealedCount++;

            updateCellUI(r, c);

            // Algoritmo de propagación (Flood Fill) si no tiene minas adyacentes
            if (cell.neighborMines === 0 && !cell.isMine) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr;
                        const nc = c + dc;
                        if (isValidCell(nr, nc)) {
                            const neighbor = board[nr][nc];
                            if (!neighbor.isRevealed && !neighbor.isFlagged) {
                                revealCell(nr, nc);
                            }
                        }
                    }
                }
            }
        }

        /**
         * Actualiza el aspecto visual del elemento DOM de la casilla según su estado.
         */
        function updateCellUI(r, c) {
            const cell = board[r][c];
            const cellElement = document.getElementById(`cell-${r}-${c}`);
            if (!cellElement) return;

            if (cell.isRevealed) {
                cellElement.classList.remove('bg-slate-700', 'hover:bg-slate-600', 'active:bg-slate-500');
                cellElement.classList.add('bg-slate-800', 'cell-revealed', 'border-slate-700');

                if (cell.isMine) {
                    cellElement.innerHTML = '💣';
                } else if (cell.neighborMines > 0) {
                    cellElement.innerHTML = `<span class="num-${cell.neighborMines}">${cell.neighborMines}</span>`;
                } else {
                    cellElement.innerHTML = '';
                }
            } else if (cell.isFlagged) {
                cellElement.innerHTML = '🚩';
            } else {
                cellElement.innerHTML = '';
            }
        }

        /**
         * Inicia el temporizador en segundos.
         */
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds++;
                if (timerSeconds > 999) timerSeconds = 999;
                document.getElementById('timer').innerText = String(timerSeconds).padStart(3, '0');
            }, 1000);
        }

        /**
         * Actualiza el marcador de minas restantes (Minas totales - Banderas colocadas).
         */
        function updateMineCounter() {
            const remaining = totalMines - flagsCount;
            const displayVal = Math.max(-99, Math.min(999, remaining));
            
            let formatted = String(displayVal);
            if (displayVal >= 0) {
                formatted = formatted.padStart(3, '0');
            } else {
                formatted = '-' + String(Math.abs(displayVal)).padStart(2, '0');
            }

            document.getElementById('mine-counter').innerText = formatted;
        }

        /**
         * Detona la partida cuando el usuario hace clic en una mina.
         */
        function triggerGameOver(hitRow, hitCol) {
            gameOver = true;
            clearInterval(timerInterval);
            document.getElementById('smiley-btn').innerText = '😵';
            document.getElementById('game-status-text').innerText = '¡Boom! Has tocado una mina.';
            playSound('explode');

            // Revelar todas las minas y señalar banderas incorrectas
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = board[r][c];
                    const cellEl = document.getElementById(`cell-${r}-${c}`);

                    if (cell.isMine) {
                        cell.isRevealed = true;
                        updateCellUI(r, c);
                        if (r === hitRow && c === hitCol) {
                            cellEl.classList.add('mine-exploded');
                        }
                    } else if (cell.isFlagged && !cell.isMine) {
                        // Bandera equivocada
                        cellEl.innerHTML = '❌';
                        cellEl.classList.add('bg-red-950/40');
                    }
                }
            }
        }

        /**
         * Comprueba si el jugador ha revelado todas las casillas sin minas.
         */
        function checkWinCondition() {
            const nonMineCells = (rows * cols) - totalMines;
            if (revealedCount === nonMineCells) {
                gameWon = true;
                clearInterval(timerInterval);
                document.getElementById('smiley-btn').innerText = '😎';
                document.getElementById('game-status-text').innerText = '¡Felicidades! Has ganado la partida 🎉';
                playSound('win');

                // Colocar banderas en las minas restantes automáticamente
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cell = board[r][c];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.isFlagged = true;
                            updateCellUI(r, c);
                        }
                    }
                }
                flagsCount = totalMines;
                updateMineCounter();
            }
        }

        /**
         * Alterna el modo bandera para dispositivos táctiles/móviles.
         */
        function toggleFlagMode() {
            mobileFlagMode = !mobileFlagMode;
            const toggleBtn = document.getElementById('flag-mode-toggle');
            const iconSpan = document.getElementById('flag-mode-icon');

            if (mobileFlagMode) {
                toggleBtn.classList.remove('bg-slate-700', 'border-slate-600');
                toggleBtn.classList.add('bg-amber-600', 'border-amber-400', 'text-white');
                iconSpan.innerText = '🚩';
            } else {
                toggleBtn.classList.remove('bg-amber-600', 'border-amber-400', 'text-white');
                toggleBtn.classList.add('bg-slate-700', 'border-slate-600');
                iconSpan.innerText = '⛏️';
            }
        }

        // Inicializar el juego una vez cargada la página
        window.onload = function() {
            setDifficulty('beginner');
        };
    </script>
</body>
</html>
