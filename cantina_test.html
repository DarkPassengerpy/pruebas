<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cantina</title>
  
  <!-- Librería para exportar Excel con estilos (xlsx-js-style) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
      --danger: #d32f2f;
      --danger-hover: #9a0007;
      --success-bg: #e8f5e9;
      --success-text: #2e7d32;
      --warning-bg: #ffebee;
      --warning-text: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .form-card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input[type="date"],
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .export-section {
      background: #f0f7f0;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .export-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 250px;
    }

    .export-controls input {
      width: 120px;
    }

    .btn-excel {
      background-color: #107c41;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-excel:hover {
      background-color: #0b592e;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #555;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-success {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .badge-danger {
      background-color: var(--warning-bg);
      color: var(--warning-text);
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background-color: var(--danger);
      color: white;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .export-section {
        flex-direction: column;
        align-items: stretch;
      }
      .export-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .export-controls input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Registro de Cantina 🛒</h1>

    <!-- Formulario de Registro -->
    <div class="form-card">
      <form id="cantinaForm">
        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
          <label for="producto">Producto / Descripción</label>
          <input type="text" id="producto" placeholder="Ej: Sándwich de Milanesa + Gaseosa" required>
        </div>

        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="pagado" checked>
            <label for="pagado">Pagado al contado</label>
          </div>
        </div>

        <div class="form-group">
          <label for="ticket">N° de Ticket / Comprobante</label>
          <input type="text" id="ticket" placeholder="Ingrese el número o deje en blanco">
        </div>

        <button type="submit" class="btn">Guardar Registro</button>
      </form>
    </div>

    <!-- Sección de Exportación a Excel -->
    <div class="export-section">
      <div class="export-controls">
        <label for="anioFiltro" style="margin: 0; white-space: nowrap;">Años a exportar:</label>
        <input type="number" id="anioFiltro" min="2000" max="2099" placeholder="Año (Ej: 2026)">
      </div>
      <button onclick="descargarExcelAnio()" class="btn-excel">Descargar Excel 📊</button>
    </div>

    <!-- Tabla de Registros -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Día</th>
            <th>Fecha</th>
            <th>Producto</th>
            <th>Pagado</th>
            <th>Ticket</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaCuerpo">
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Inicializar registros desde LocalStorage
    let registros = JSON.parse(localStorage.getItem('cantina_registros')) || [];

    const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    document.addEventListener('DOMContentLoaded', () => {
      // Establecer fecha de hoy por defecto
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fecha').value = hoy;
      
      // Establecer año actual por defecto en el filtro de exportación
      document.getElementById('anioFiltro').value = new Date().getFullYear();

      renderizarTabla();
    });

    // Función para obtener el día de la semana
    function obtenerNombreDia(fechaStr) {
      const partes = fechaStr.split('-');
      const fecha = new Date(partes[0], partes[1] - 1, partes[2]);
      return diasSemana[fecha.getDay()];
    }

    // Manejo del formulario
    document.getElementById('cantinaForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const fecha = document.getElementById('fecha').value;
      const producto = document.getElementById('producto').value.trim();
      const pagado = document.getElementById('pagado').checked;
      let ticket = document.getElementById('ticket').value.trim();

      if (!ticket) {
        ticket = "No se imprimió";
      }

      const nuevoRegistro = {
        id: Date.now(),
        fecha,
        producto,
        pagado,
        ticket
      };

      registros.push(nuevoRegistro);
      guardarDatos();
      renderizarTabla();

      // Limpiar formulario salvo fecha
      document.getElementById('producto').value = '';
      document.getElementById('ticket').value = '';
      document.getElementById('pagado').checked = true;
    });

    function guardarDatos() {
      localStorage.setItem('cantina_registros', JSON.stringify(registros));
    }

    function eliminarRegistro(id) {
      if (confirm('¿Estás seguro de eliminar este registro?')) {
        registros = registros.filter(r => r.id !== id);
        guardarDatos();
        renderizarTabla();
      }
    }

    function renderizarTabla() {
      const tbody = document.getElementById('tablaCuerpo');
      tbody.innerHTML = '';

      if (registros.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No hay registros guardados aún.</td></tr>`;
        return;
      }

      // Ordenar registros por fecha (más reciente primero)
      const registrosOrdenados = [...registros].sort((a, b) => b.fecha.localeCompare(a.fecha));

      registrosOrdenados.forEach(item => {
        const partes = item.fecha.split('-');
        const fechaFormateada = `${partes[2]}/${partes[1]}/${partes[0]}`;
        const diaSemana = obtenerNombreDia(item.fecha);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${diaSemana}</strong></td>
          <td>${fechaFormateada}</td>
          <td>${item.producto}</td>
          <td>
            <span class="badge ${item.pagado ? 'badge-success' : 'badge-danger'}">
              ${item.pagado ? 'Sí' : 'No'}
            </span>
          </td>
          <td>${item.ticket}</td>
          <td>
            <button class="btn-delete" onclick="eliminarRegistro(${item.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // EXPORTACIÓN A EXCEL CON FORMATO Y ESTILOS
    function descargarExcelAnio() {
      if (typeof XLSX === 'undefined') {
        return alert("Error: No se pudo cargar la librería para generar archivos Excel.");
      }

      const anioSeleccionado = document.getElementById("anioFiltro").value;
      if (!anioSeleccionado) return alert("Por favor, ingresa un año válido.");

      const registrosAnio = registros.filter(r => r.fecha.startsWith(anioSeleccionado));
      if (registrosAnio.length === 0) return alert(`No hay registros para el año ${anioSeleccionado}.`);

      const registrosOrdenados = [...registrosAnio].sort((a, b) => a.fecha.localeCompare(b.fecha));

      // 1. Matriz de Encabezados y Datos
      const headers = ["Día", "Fecha", "Producto", "Pagado al contado", "Ticket"];
      const data = [headers];

      registrosOrdenados.forEach(item => {
        const partes = item.fecha.split("-");
        const fechaFormateada = `${partes[2]}/${partes[1]}/${partes[0]}`;
        const diaSemana = obtenerNombreDia(item.fecha);

        data.push([
          diaSemana,
          fechaFormateada,
          item.producto,
          item.pagado ? "Sí" : "No",
          item.ticket === "No se imprimió" ? "No se imprimió" : item.ticket
        ]);
      });

      // 2. Crear hoja de trabajo
      const worksheet = XLSX.utils.aoa_to_sheet(data);

      // 3. Estilos visuales para Excel
      const headerStyle = {
        font: { name: "Arial", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
        fill: { fgColor: { rgb: "107C41" } }, // Verde institucional
        alignment: { horizontal: "center", vertical: "center" },
        border: {
          top: { style: "thin", color: { rgb: "0E6233" } },
          bottom: { style: "thin", color: { rgb: "0E6233" } },
          left: { style: "thin", color: { rgb: "0E6233" } },
          right: { style: "thin", color: { rgb: "0E6233" } }
        }
      };

      const zebraStyle = {
        font: { name: "Arial", sz: 10 },
        fill: { fgColor: { rgb: "F4F8F5" } }, // Fondo verde muy tenue
        alignment: { vertical: "center" },
        border: {
          top: { style: "thin", color: { rgb: "D3D3D3" } },
          bottom: { style: "thin", color: { rgb: "D3D3D3" } },
          left: { style: "thin", color: { rgb: "D3D3D3" } },
          right: { style: "thin", color: { rgb: "D3D3D3" } }
        }
      };

      const normalStyle = {
        font: { name: "Arial", sz: 10 },
        fill: { fgColor: { rgb: "FFFFFF" } }, // Blanco
        alignment: { vertical: "center" },
        border: {
          top: { style: "thin", color: { rgb: "D3D3D3" } },
          bottom: { style: "thin", color: { rgb: "D3D3D3" } },
          left: { style: "thin", color: { rgb: "D3D3D3" } },
          right: { style: "thin", color: { rgb: "D3D3D3" } }
        }
      };

      // 4. Aplicar los estilos a las celdas
      const range = XLSX.utils.decode_range(worksheet['!ref']);
      for (let R = range.s.r; R <= range.e.r; ++R) {
        for (let C = range.s.c; C <= range.e.c; ++C) {
          const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
          if (!worksheet[cell_address]) continue;

          if (R === 0) {
            // Estilo para el encabezado
            worksheet[cell_address].s = headerStyle;
          } else {
            // Estilo alternado para filas de datos
            const baseStyle = (R % 2 === 0) ? zebraStyle : normalStyle;
            const cellStyle = JSON.parse(JSON.stringify(baseStyle));

            // Alineación específica según la columna
            if (C === 0 || C === 1 || C === 3 || C === 4) {
              cellStyle.alignment.horizontal = "center";
            } else {
              cellStyle.alignment.horizontal = "left";
            }
            worksheet[cell_address].s = cellStyle;
          }
        }
      }

      // 5. Ancho cómodo para cada columna
      worksheet['!cols'] = [
        { wch: 14 }, // Día
        { wch: 12 }, // Fecha
        { wch: 35 }, // Producto
        { wch: 20 }, // Pagado al contado
        { wch: 18 }  // Ticket
      ];

      // 6. Generar y descargar el libro de trabajo
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, `Cantina ${anioSeleccionado}`);

      XLSX.writeFile(workbook, `Registros_Cantina_${anioSeleccionado}.xlsx`);
    }
  </script>
</body>
</html>
