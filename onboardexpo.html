<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Board - Expo</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="ico.png">
    <!-- Librería para exportación de Excel con Estilos (xlsx-js-style) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Estilo para el enlace simple de volver a inicio */
        .link-inicio {
            display: inline-block;
            color: #17a2b8;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
            transition: color 0.2s ease;
        }

        .link-inicio:hover {
            color: #007bff;
            text-decoration: underline;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Autenticación */
        .auth-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .auth-bar input {
            width: 160px;
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2d2d2d;
            color: #ffffff;
        }

        .btn-login {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-login:hover { background-color: #0056b3; }

        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-logout:hover { background-color: #c82333; }

        .editor-info {
            font-size: 12px;
            color: #28a745;
            font-weight: bold;
        }

        .section-box {
            background: #252525;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.85em;
            font-weight: bold;
            color: #17a2b8;
            text-transform: uppercase;
        }

        input[type="text"], input[type="date"] {
            padding: 9px 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2d2d2d;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
            width: 100%;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: #007bff;
        }

        .ports-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .port-chip {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .port-chip.selected {
            background-color: #007bff;
            border-color: #0056b3;
            color: #ffffff;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            margin: 15px auto 0 auto;
            display: block;
        }

        .btn-add:hover { background-color: #218838; }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .search-container {
            flex: 1 1 auto;
            position: relative;
            min-width: 120px;
        }

        .search-container input {
            padding: 8px 12px 8px 34px;
            font-size: 13px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #1a1a1a;
            color: #ffffff;
            width: 100%;
            box-sizing: border-box;
            height: 38px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 13px;
        }

        .year-select {
            padding: 0 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #252525;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            height: 38px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .year-select:focus {
            border-color: #007bff;
        }

        .excel-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .excel-bar .btn-excel {
            flex: 0 0 auto;
            min-width: auto;
            padding: 0 16px;
        }

        .backup-bar {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #333;
            flex-wrap: wrap;
        }

        .btn-tool {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            height: 38px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-excel { background-color: #1f7244; }
        .btn-excel:hover { background-color: #155230; }

        .btn-export { background-color: #6f42c1; flex: 1; min-width: 140px; }
        .btn-export:hover { background-color: #59339d; }

        .btn-import { background-color: #fd7e14; flex: 1; min-width: 140px; }
        .btn-import:hover { background-color: #e86e0c; }

        .year-group-container {
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .year-header {
            background-color: #111;
            color: #ffc107;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .year-header:hover { background-color: #000; }

        .year-body {
            display: none;
            padding: 15px;
        }
        .year-group-container.open .year-body {
            display: block;
        }

        .month-group-container {
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #383838;
            border-radius: 6px;
            overflow: hidden;
        }

        .month-header {
            background: linear-gradient(90deg, #17a2b8, #007bff);
            color: #ffffff;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .month-body {
            display: none;
            padding: 12px;
            background: #1e1e1e;
        }
        .month-group-container.open .month-body {
            display: block;
        }

        .group-count {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
        }

        .arrow-icon {
            font-size: 12px;
            transition: transform 0.2s;
        }
        
        .year-group-container.open > .year-header > .header-left > .arrow-icon,
        .month-group-container.open > .month-header > .header-left > .arrow-icon,
        .vessel-card.open > .vessel-header > .vessel-title-group > .arrow-icon {
            transform: rotate(180deg);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vessels-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vessel-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            transition: 0.2s;
        }

        .vessel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #252525;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
            gap: 8px;
            transition: background 0.2s;
        }

        .vessel-header:hover { background: #2d2d2d; }

        .vessel-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vessel-title {
            font-size: 1.05em;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vessel-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-delete-vessel {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-delete-vessel:hover { background-color: #dc3545; color: white; }

        .vessel-body {
            display: none;
            padding: 15px 18px;
            background-color: #1e1e1e;
            border-top: 1px solid #444;
        }

        .vessel-card.open .vessel-body {
            display: block;
        }

        .ports-container-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .port-row-card {
            background: #252525;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .port-check-label {
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            min-width: 180px;
        }

        .port-check-name {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
        }

        .port-dates-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-subgroup {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-label {
            font-size: 11px;
            font-weight: bold;
            color: #17a2b8;
        }

        .date-subgroup input[type="date"] {
            padding: 4px 8px;
            font-size: 12px;
            width: 130px;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #888;
            font-style: italic;
            background: #252525;
            border-radius: 8px;
            border: 1px dashed #444;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Enlace simple a la Página de Inicio -->
    <a href="https://ofi.darkpassenger.workers.dev/" class="link-inicio">
        ← Volver a la Página de Inicio
    </a>

    <!-- Formulario de Autenticación -->
    <div class="auth-bar" id="authDesconectado">
        <input type="email" id="inputEmail" placeholder="Correo de Editor...">
        <input type="password" id="inputClave" placeholder="Contraseña..." onkeypress="if(event.key === 'Enter') window.iniciarSesion()">
        <button class="btn-login" onclick="window.iniciarSesion()">Acceder</button>
    </div>
    <div class="auth-bar" id="authConectado" style="display: none;">
        <span class="editor-info" id="nombreEditor"></span>
        <button class="btn-logout" onclick="window.cerrarSesion()">Salir</button>
    </div>

    <h2>On Board - Expo</h2>
    
    <!-- Panel de Edición (Solo visible para usuarios registrados en 'editores_onboard') -->
    <div id="panelEdicion" style="display: none;">
        <div class="section-box">
            <div class="form-group">
                <label>Buque Fluvial</label>
                <input type="text" id="inputBuque" placeholder="Ej: AMALIA, RIO PARANA..." onkeypress="window.handleEnter(event)">
            </div>

            <div class="form-group">
                <label>Seleccionar Puertos Frecuentes</label>
                <div class="ports-selector">
                    <div class="port-chip" onclick="window.toggleChip(this)">TERPORT VILLETA</div>
                    <div class="port-chip" onclick="window.toggleChip(this)">SEGURO FLUVIAL</div>
                    <div class="port-chip" onclick="window.toggleChip(this)">VILLETA ANNP</div>
                    <div class="port-chip" onclick="window.toggleChip(this)">CAACUPEMI</div>
                    <div class="port-chip" onclick="window.toggleChip(this)">FENIX</div>
                    <div class="port-chip" onclick="window.toggleChip(this)">SAN JOSE</div>
                    <div class="port-chip" onclick="window.toggleChip(this)">CAACUPEMI PILAR</div>
                </div>
            </div>

            <div class="form-group">
                <label>Otros Puertos (Opcional - Separar por coma)</label>
                <input type="text" id="inputOtrosPuertos" placeholder="Ej: PUERTO ANTP, TERMINAL B" onkeypress="window.handleEnter(event)">
            </div>

            <button class="btn-add" onclick="window.agregarBuqueFluvial()">Registrar Buque y Puertos ➕</button>
        </div>
    </div>

    <!-- Barra de Filtros -->
    <div class="filter-bar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="inputBusqueda" placeholder="Buscar buque, puerto, fecha..." onkeyup="window.filtrarLista()">
        </div>

        <select id="selectAnioFiltro" class="year-select" onchange="window.filtrarLista()">
            <!-- Generado dinámicamente -->
        </select>
    </div>

    <!-- Barra de Exportación Excel Compacta -->
    <div class="excel-bar">
        <button class="btn-tool btn-excel" onclick="window.exportarExcel()">📊 Exportar a Excel</button>
        <select id="selectAnioExcel" class="year-select">
            <!-- Generado dinámicamente -->
        </select>
    </div>

    <!-- Lista Principal de Buques -->
    <div id="contenedorBuques">
        <!-- Renderizado dinámico -->
    </div>

    <!-- Bloque de Respaldos al Final de todo -->
    <div class="backup-bar" id="panelBackup" style="display: none;">
        <button class="btn-tool btn-export" onclick="window.exportarBackup()">💾 Guardar Backup</button>
        
        <label class="btn-tool btn-import" style="margin: 0; cursor: pointer;">
            📂 Cargar Backup
            <input type="file" id="inputBackup" accept=".json" style="display: none;" onchange="window.importarBackup(event)">
        </label>
    </div>
</div>

<!-- Firebase Modular SDK v10 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy, writeBatch, getDocs, getDoc, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNBtP1LlunXnwfZfseVCmdfNOoh0Q_u0w",
      authDomain: "oficode-97a1f.firebaseapp.com",
      projectId: "oficode-97a1f",
      storageBucket: "oficode-97a1f.firebasestorage.app",
      messagingSenderId: "207310014715",
      appId: "1:207310014715:web:53f5e1111d6f7f45b9485e",
      measurementId: "G-RVGJVS1BFY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let baseDatosOnboard = [];
    let usuarioActual = null;
    let unsubscribeOnboard = null;
    let ultimoAnioCargado = null;

    let tarjetasAbiertasIDs = new Set();
    let mesesAbiertosKeys = new Set(); 
    let aniosAbiertosKeys = new Set(); 

    const MESES_ORDEN = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

    // Función auxiliar para obtener siempre el año actual dinámicamente
    function obtenerAnioActual() {
        return new Date().getFullYear().toString();
    }

    // Verifica si el usuario autenticado existe dentro de la colección 'editores_onboard'
    onAuthStateChanged(auth, async (user) => {
        const divDesconectado = document.getElementById('authDesconectado');
        const divConectado = document.getElementById('authConectado');
        const panelEdicion = document.getElementById('panelEdicion');
        const panelBackup = document.getElementById('panelBackup');

        if (user) {
            try {
                const editorDocRef = doc(db, "editores_onboard", user.uid);
                const editorDocSnap = await getDoc(editorDocRef);

                if (editorDocSnap.exists()) {
                    usuarioActual = user;
                    divDesconectado.style.display = 'none';
                    divConectado.style.display = 'flex';
                    panelEdicion.style.display = 'block';
                    panelBackup.style.display = 'flex';

                    const identificador = user.displayName || user.email.split('@')[0];
                    document.getElementById('nombreEditor').innerText = `👋 Hola, ${identificador} (Editor)`;
                } else {
                    usuarioActual = null;
                    divDesconectado.style.display = 'none';
                    divConectado.style.display = 'flex';
                    panelEdicion.style.display = 'none';
                    panelBackup.style.display = 'none';

                    document.getElementById('nombreEditor').innerText = `👤 ${user.email} (Sin permisos de edición)`;
                }
            } catch (err) {
                console.error("Error validando permisos de editor:", err);
                usuarioActual = null;
            }
        } else {
            usuarioActual = null;
            divDesconectado.style.display = 'flex';
            divConectado.style.display = 'none';
            panelEdicion.style.display = 'none';
            panelBackup.style.display = 'none';
            document.getElementById('inputClave').value = '';
            document.getElementById('inputEmail').value = '';
        }
        
        window.renderizarBuques();
    });

    // Carga filtrada en el Servidor (Optimización de lecturas en Firestore)
    window.cargarDatosPorAnio = (anioElegido) => {
        if (unsubscribeOnboard) {
            unsubscribeOnboard();
        }

        ultimoAnioCargado = anioElegido;

        let q;
        if (anioElegido === 'ALL' || !anioElegido) {
            q = query(collection(db, "onboard"));
        } else {
            q = query(collection(db, "onboard"), where("anio", "==", anioElegido));
        }

        unsubscribeOnboard = onSnapshot(q, (snapshot) => {
            baseDatosOnboard = [];
            snapshot.forEach((doc) => {
                baseDatosOnboard.push({ id: doc.id, ...doc.data() });
            });

            // Ordenamiento por fecha de creación en la memoria del navegador
            baseDatosOnboard.sort((a, b) => {
                const fechaA = a.fechaCreacion ? a.fechaCreacion.seconds : 0;
                const fechaB = b.fechaCreacion ? b.fechaCreacion.seconds : 0;
                return fechaB - fechaA;
            });

            window.cargarOpcionesAnio();
            window.renderizarBuques();
        });
    };

    // Carga inicial (Descarga solo el año en curso por defecto)
    window.cargarDatosPorAnio(obtenerAnioActual());

    window.iniciarSesion = async () => {
        const email = document.getElementById('inputEmail').value.trim();
        const clave = document.getElementById('inputClave').value.trim();

        if (!email || !clave) {
            alert("Por favor completa el correo y la contraseña.");
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, clave);
        } catch (error) {
            console.error("Error al iniciar sesión:", error);
            alert("Credenciales incorrectas o usuario no registrado.");
        }
    };

    window.cerrarSesion = async () => {
        try { await signOut(auth); } 
        catch (error) { console.error("Error al salir:", error); }
    };

    window.cargarOpcionesAnio = () => {
        const selectFiltro = document.getElementById('selectAnioFiltro');
        const selectExcel = document.getElementById('selectAnioExcel');
        const currentYearNum = new Date().getFullYear();
        
        const selectedValFiltro = selectFiltro ? selectFiltro.value : '';
        const selectedValExcel = selectExcel ? selectExcel.value : '';

        let aniosArray = [];
        for (let y = currentYearNum; y >= 2024; y--) {
            aniosArray.push(y.toString());
        }

        baseDatosOnboard.forEach(b => {
            if (b.anio && !aniosArray.includes(b.anio)) {
                aniosArray.push(b.anio);
            }
        });

        aniosArray.sort((a, b) => b.localeCompare(a));

        let htmlFiltro = `<option value="ALL">Año: Todos</option>`;
        let htmlExcel = `<option value="TODOS">Exportar: Todos los Años</option>`;

        aniosArray.forEach(a => {
            htmlFiltro += `<option value="${a}">${a}</option>`;
            htmlExcel += `<option value="${a}">Exportar: Año ${a}</option>`;
        });

        if (selectFiltro) {
            selectFiltro.innerHTML = htmlFiltro;
            if (selectedValFiltro && Array.from(selectFiltro.options).some(opt => opt.value === selectedValFiltro)) {
                selectFiltro.value = selectedValFiltro;
            } else if (ultimoAnioCargado) {
                selectFiltro.value = ultimoAnioCargado;
            } else {
                selectFiltro.value = currentYearNum.toString();
            }
        }

        if (selectExcel) {
            selectExcel.innerHTML = htmlExcel;
            if (selectedValExcel && Array.from(selectExcel.options).some(opt => opt.value === selectedValExcel)) {
                selectExcel.value = selectedValExcel;
            } else {
                selectExcel.value = 'TODOS';
            }
        }
    };

    function inicializarPanelesAbiertos() {
        if(aniosAbiertosKeys.size === 0 && mesesAbiertosKeys.size === 0) {
            const now = new Date();
            const year = now.getFullYear().toString();
            const month = MESES_ORDEN[now.getMonth()];
            aniosAbiertosKeys.add(year);
            mesesAbiertosKeys.add(`${year}-${month}`);
        }
    }

    window.onload = function() {
        inicializarPanelesAbiertos();
        window.cargarOpcionesAnio();
        window.renderizarBuques();
    };

    window.toggleChip = (chip) => {
        chip.classList.toggle('selected');
    };

    window.agregarBuqueFluvial = async () => {
        if (!usuarioActual) {
            alert("No tienes permisos para agregar registros.");
            return;
        }

        const buqueNombre = document.getElementById('inputBuque').value.trim().toUpperCase();

        if (buqueNombre === "") {
            alert("Por favor ingresá el nombre del Buque Fluvial.");
            return;
        }

        const now = new Date();
        const anioVal = now.getFullYear().toString();
        const mesVal = MESES_ORDEN[now.getMonth()];

        let puertosNombres = [];
        document.querySelectorAll('.port-chip.selected').forEach(chip => {
            puertosNombres.push(chip.innerText.trim());
        });

        const otros = document.getElementById('inputOtrosPuertos').value.trim().toUpperCase();
        if (otros !== "") {
            otros.split(',').forEach(p => {
                let pClean = p.trim();
                if (pClean && !puertosNombres.includes(pClean)) {
                    puertosNombres.push(pClean);
                }
            });
        }

        if (puertosNombres.length === 0) {
            alert("Por favor seleccioná o ingresá al menos un puerto para el buque.");
            return;
        }

        const existe = baseDatosOnboard.find(b => b.buque === buqueNombre && (b.anio || obtenerAnioActual()) === anioVal && (b.mes || "S/D") === mesVal);
        if (existe) {
            alert(`El buque "${buqueNombre}" ya fue registrado en el período ${mesVal} ${anioVal}.`);
            return;
        }

        const autorRegistro = usuarioActual.displayName || usuarioActual.email;
        const nuevosPuertos = puertosNombres.map(pName => ({
            nombre: pName,
            fecha1: "",
            fecha2: ""
        }));

        try {
            const docRef = await addDoc(collection(db, "onboard"), {
                buque: buqueNombre,
                anio: anioVal,
                mes: mesVal,
                puertos: nuevosPuertos,
                autor: autorRegistro,
                fechaCreacion: serverTimestamp()
            });

            aniosAbiertosKeys.add(anioVal);
            mesesAbiertosKeys.add(`${anioVal}-${mesVal}`);
            tarjetasAbiertasIDs.add(docRef.id);

            document.getElementById('inputBuque').value = "";
            document.getElementById('inputOtrosPuertos').value = "";
            document.querySelectorAll('.port-chip.selected').forEach(c => c.classList.remove('selected'));
        } catch (error) {
            console.error("Error al registrar buque:", error);
            alert("No tienes permisos de edición o hubo un error en la conexión.");
        }
    };

    window.handleEnter = (e) => {
        if (e.key === "Enter") window.agregarBuqueFluvial();
    };

    window.toggleYearGroup = (headerElem, anioStr) => {
        const container = headerElem.closest('.year-group-container');
        container.classList.toggle('open');
        if (container.classList.contains('open')) aniosAbiertosKeys.add(anioStr);
        else aniosAbiertosKeys.delete(anioStr);
    };

    window.toggleMonthGroup = (headerElem, anioMesKey) => {
        const container = headerElem.closest('.month-group-container');
        container.classList.toggle('open');
        if (container.classList.contains('open')) mesesAbiertosKeys.add(anioMesKey);
        else mesesAbiertosKeys.delete(anioMesKey);
    };

    window.toggleVesselCard = (headerElem, vesselId) => {
        const card = headerElem.closest('.vessel-card');
        card.classList.toggle('open');
        if (card.classList.contains('open')) tarjetasAbiertasIDs.add(vesselId);
        else tarjetasAbiertasIDs.delete(vesselId);
    };

    window.actualizarFechaPuerto = async (vesselId, portIndex, numFecha, valorFecha) => {
        if (!usuarioActual) {
            alert("No tienes permisos para actualizar fechas.");
            return;
        }

        const buqueObj = baseDatosOnboard.find(b => b.id === vesselId);
        if (buqueObj && buqueObj.puertos[portIndex]) {
            const puertosActualizados = [...buqueObj.puertos];
            if (numFecha === 1) puertosActualizados[portIndex].fecha1 = valorFecha;
            if (numFecha === 2) puertosActualizados[portIndex].fecha2 = valorFecha;

            try {
                await updateDoc(doc(db, "onboard", vesselId), {
                    puertos: puertosActualizados
                });
            } catch (err) {
                console.error("Error actualizando fecha:", err);
            }
        }
    };

    window.eliminarBuque = async (vesselId, event) => {
        if (event) event.stopPropagation();
        if (!usuarioActual) return;

        const buqueObj = baseDatosOnboard.find(b => b.id === vesselId);
        if (confirm(`¿Estás seguro de eliminar el buque "${buqueObj.buque}" y todos sus puertos?`)) {
            try {
                await deleteDoc(doc(db, "onboard", vesselId));
                tarjetasAbiertasIDs.delete(vesselId);
            } catch (err) {
                console.error("Error eliminando buque:", err);
                alert("Error al eliminar el registro.");
            }
        }
    };

    window.filtrarLista = () => {
        const selectAnio = document.getElementById('selectAnioFiltro');
        const anioSeleccionado = selectAnio ? selectAnio.value : 'ALL';

        if (ultimoAnioCargado !== anioSeleccionado) {
            window.cargarDatosPorAnio(anioSeleccionado);
        } else {
            window.renderizarBuques();
        }
    };

    function formatFechaStandard(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return dateStr;
    }

    window.renderizarBuques = () => {
        const contenedor = document.getElementById('contenedorBuques');
        const busquedaText = document.getElementById('inputBusqueda').value.toUpperCase().trim();
        const selectAnio = document.getElementById('selectAnioFiltro');
        const anioSeleccionado = selectAnio ? selectAnio.value : 'ALL';
        const isSearching = busquedaText.length > 0;

        contenedor.innerHTML = "";

        let listaFiltrada = baseDatosOnboard.filter(b => {
            let anioStr = b.anio || obtenerAnioActual();
            let mesStr = b.mes || "S/D";

            if (anioSeleccionado !== 'ALL' && anioStr !== anioSeleccionado) {
                return false;
            }

            let matchText = b.buque.includes(busquedaText) || 
                            anioStr.includes(busquedaText) || 
                            mesStr.includes(busquedaText) ||
                            b.puertos.some(p => 
                                p.nombre.includes(busquedaText) || 
                                formatFechaStandard(p.fecha1).includes(busquedaText) || 
                                formatFechaStandard(p.fecha2).includes(busquedaText)
                            );
            return matchText;
        });

        if (listaFiltrada.length === 0) {
            contenedor.innerHTML = `<div class="empty-msg">No se encontraron buques con los criterios seleccionados.</div>`;
            return;
        }

        const estructura = new Map();
        listaFiltrada.forEach(b => {
            let anio = b.anio || obtenerAnioActual();
            let mes = b.mes || "S/D";
            
            if (!estructura.has(anio)) estructura.set(anio, new Map());
            if (!estructura.get(anio).has(mes)) estructura.get(anio).set(mes, []);
            
            estructura.get(anio).get(mes).push(b);
        });

        const aniosOrdenados = Array.from(estructura.keys()).sort((a, b) => b.localeCompare(a));

        aniosOrdenados.forEach(anio => {
            const esAnioAbierto = isSearching || aniosAbiertosKeys.has(anio);
            const yearGroupDiv = document.createElement('div');
            yearGroupDiv.className = `year-group-container ${esAnioAbierto ? 'open' : ''}`;

            const yearMeses = estructura.get(anio);
            let totalBuquesAnio = 0;
            Array.from(yearMeses.values()).forEach(arr => totalBuquesAnio += arr.length);

            let yearHTML = `
                <div class="year-header" onclick="window.toggleYearGroup(this, '${anio}')">
                    <div class="header-left">
                        <span class="arrow-icon">▼</span>
                        <span>📅 AÑO: ${anio}</span>
                    </div>
                    <span class="group-count">${totalBuquesAnio} registros</span>
                </div>
                <div class="year-body">
            `;

            const mesesOrdenados = Array.from(yearMeses.keys()).sort((a, b) => {
                return MESES_ORDEN.indexOf(b) - MESES_ORDEN.indexOf(a);
            });

            mesesOrdenados.forEach(mes => {
                const anioMesKey = `${anio}-${mes}`;
                const esMesAbierto = isSearching || mesesAbiertosKeys.has(anioMesKey);
                const buquesMes = yearMeses.get(mes);
                buquesMes.sort((a, b) => a.buque.localeCompare(b.buque));

                yearHTML += `
                    <div class="month-group-container ${esMesAbierto ? 'open' : ''}">
                        <div class="month-header" onclick="window.toggleMonthGroup(this, '${anioMesKey}')">
                            <div class="header-left">
                                <span class="arrow-icon">▼</span>
                                <span>🗓️ ${mes}</span>
                            </div>
                            <span class="group-count">${buquesMes.length} buques</span>
                        </div>
                        <div class="month-body">
                            <div class="vessels-list">
                `;

                let cardsHTMLArray = [];

                buquesMes.forEach(b => {
                    const estaAbierta = isSearching || tarjetasAbiertasIDs.has(b.id);
                    const disabledAttr = usuarioActual ? '' : 'disabled style="opacity: 0.9; cursor: default;"';

                    let portsCheckHTML = "";
                    b.puertos.forEach((p, idx) => {
                        portsCheckHTML += `
                            <div class="port-row-card">
                                <div class="port-check-label">
                                    <span style="color: #17a2b8; margin-right: 6px;">📍</span>
                                    <span class="port-check-name">${p.nombre}</span>
                                </div>
                                <div class="port-dates-group">
                                    <div class="date-subgroup">
                                        <span class="date-label">F. On Board 1:</span>
                                        <input type="date" value="${p.fecha1 || ''}" ${disabledAttr} onchange="window.actualizarFechaPuerto('${b.id}', ${idx}, 1, this.value)">
                                    </div>
                                    <div class="date-subgroup">
                                        <span class="date-label">F. On Board 2:</span>
                                        <input type="date" value="${p.fecha2 || ''}" ${disabledAttr} onchange="window.actualizarFechaPuerto('${b.id}', ${idx}, 2, this.value)">
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    let deleteBtnHTML = usuarioActual 
                        ? `<button class="btn-delete-vessel" onclick="window.eliminarBuque('${b.id}', event)" title="Eliminar buque">🗑️ Eliminar</button>` 
                        : '';

                    let cardStr = `
                        <div class="vessel-card ${estaAbierta ? 'open' : ''}">
                            <div class="vessel-header" onclick="window.toggleVesselCard(this, '${b.id}')">
                                <div class="vessel-title-group">
                                    <span class="arrow-icon">▼</span>
                                    <div class="vessel-title">
                                        🚢 <strong>${b.buque}</strong>
                                    </div>
                                </div>
                                <div class="vessel-actions">
                                    ${deleteBtnHTML}
                                </div>
                            </div>
                            <div class="vessel-body">
                                <div class="ports-container-list">
                                    ${portsCheckHTML}
                                </div>
                            </div>
                        </div>
                    `;
                    cardsHTMLArray.push(cardStr);
                });

                yearHTML += cardsHTMLArray.join('');
                yearHTML += `</div></div></div>`;
            });

            yearHTML += `</div>`;
            yearGroupDiv.innerHTML = yearHTML;
            contenedor.appendChild(yearGroupDiv);
        });
    };

    window.exportarExcel = () => {
        if (baseDatosOnboard.length === 0) {
            alert("No hay registros para exportar a Excel.");
            return;
        }

        const selectExcel = document.getElementById('selectAnioExcel');
        const anioElegido = selectExcel ? selectExcel.value : 'TODOS';

        let datosAExportar = baseDatosOnboard;
        if (anioElegido !== 'TODOS' && anioElegido !== '') {
            datosAExportar = baseDatosOnboard.filter(b => (b.anio || obtenerAnioActual()) === anioElegido);
            if (datosAExportar.length === 0) {
                alert(`No se encontraron registros para el año "${anioElegido}".`);
                return;
            }
        }

        const wb = XLSX.utils.book_new();
        const headers = ["AÑO", "MES", "BUQUE FLUVIAL", "PUERTO", "FECHA ON BOARD 1", "FECHA ON BOARD 2"];
        
        let rows = [];
        datosAExportar.forEach(b => {
            b.puertos.forEach(p => {
                rows.push([
                    b.anio || obtenerAnioActual(),
                    b.mes || "S/D",
                    b.buque, 
                    p.nombre, 
                    formatFechaStandard(p.fecha1), 
                    formatFechaStandard(p.fecha2)
                ]);
            });
        });

        const data = [headers, ...rows];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const range = XLSX.utils.decode_range(ws['!ref']);

        const styleHeader = {
            font: { name: "Aptos", sz: 10, bold: true, color: { rgb: "FFFFFF" } },
            fill: { fgColor: { rgb: "41719C" } },
            alignment: { horizontal: "center", vertical: "center" },
            border: {
                top: { style: "thin", color: { rgb: "2B4C7E" } },
                bottom: { style: "thin", color: { rgb: "2B4C7E" } },
                left: { style: "thin", color: { rgb: "2B4C7E" } },
                right: { style: "thin", color: { rgb: "2B4C7E" } }
            }
        };

        const styleData = {
            font: { name: "Aptos", sz: 10 },
            alignment: { horizontal: "center", vertical: "center" },
            border: {
                top: { style: "thin", color: { rgb: "B4C6E7" } },
                bottom: { style: "thin", color: { rgb: "B4C6E7" } },
                left: { style: "thin", color: { rgb: "B4C6E7" } },
                right: { style: "thin", color: { rgb: "B4C6E7" } }
            }
        };

        for (let R = range.s.r; R <= range.e.r; ++R) {
            for (let C = range.s.c; C <= range.e.c; ++C) {
                const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                if (!ws[cellAddress]) continue;
                ws[cellAddress].s = (R === 0) ? styleHeader : styleData;
            }
        }

        ws['!autofilter'] = { ref: `A1:F${data.length}` };
        ws['!cols'] = [{ wch: 10 }, { wch: 15 }, { wch: 22 }, { wch: 22 }, { wch: 18 }, { wch: 18 }];

        const nombreArchivo = (anioElegido !== 'TODOS' && anioElegido !== '') 
            ? `Fecha_On_Board_${anioElegido}.xlsx` 
            : `Fecha_On_Board_Todos.xlsx`;

        XLSX.utils.book_append_sheet(wb, ws, "On_Board");
        XLSX.writeFile(wb, nombreArchivo);
    };

    window.exportarBackup = () => {
        if (baseDatosOnboard.length === 0) {
            alert("No hay registros guardados para hacer backup.");
            return;
        }

        const dataAExportar = baseDatosOnboard.map(({ buque, anio, mes, puertos }) => ({ buque, anio, mes, puertos }));
        const jsonStr = JSON.stringify(dataAExportar, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_onboard_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    window.importarBackup = async (event) => {
        const file = event.target.files[0];
        if (!file || !usuarioActual) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const datosImportados = JSON.parse(e.target.result);
                if (Array.isArray(datosImportados) && datosImportados.length > 0) {
                    if (confirm(`Se encontraron ${datosImportados.length} buques en el backup. ¿Deseas subirlos a Firebase?`)) {
                        const autorRegistro = usuarioActual.displayName || usuarioActual.email;
                        const batch = writeBatch(db);
                        let contadorPreparados = 0;

                        for (let item of datosImportados) {
                            const nombreBuque = (item.buque || "").toString().trim().toUpperCase();
                            const anioVal = item.anio || obtenerAnioActual();
                            const mesVal = item.mes || "SEPTIEMBRE";

                            if (nombreBuque) {
                                const nuevoDocRef = doc(collection(db, "onboard"));
                                batch.set(nuevoDocRef, {
                                    buque: nombreBuque,
                                    anio: anioVal,
                                    mes: mesVal,
                                    puertos: (item.puertos || []).map(p => ({
                                        nombre: p.nombre,
                                        fecha1: p.fecha1 || "",
                                        fecha2: p.fecha2 || ""
                                    })),
                                    autor: autorRegistro,
                                    fechaCreacion: serverTimestamp()
                                });
                                contadorPreparados++;
                            }
                        }

                        if (contadorPreparados > 0) {
                            await batch.commit();
                            alert(`¡Éxito! Se subieron ${contadorPreparados} buques a Firebase.`);
                        }
                    }
                } else {
                    alert("El archivo no contiene un formato de backup válido.");
                }
            } catch (err) {
                console.error("Error al importar backup:", err);
                alert("Error al leer el archivo de backup.");
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    };
</script>
